name: ML ranking V2 tests

on:
  push:
    branches: [automation]
    paths:
      - "ml/**"
      - "backend/src/services/donorRankingService.js"
      - "backend/src/routes/donorEligibilityRoutes.js"
      - "backend/src/routes/donorRankingRoutes.js"
      - "backend/test/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/.env.example"
      - ".github/workflows/ml-v2-tests.yml"
  pull_request:
    paths:
      - "ml/**"
      - "backend/src/services/donorRankingService.js"
      - "backend/src/routes/donorEligibilityRoutes.js"
      - "backend/src/routes/donorRankingRoutes.js"
      - "backend/test/**"
      - "backend/package.json"
      - "backend/package-lock.json"

jobs:
  backend-ranking-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm --prefix backend test -- ./test/donor-ranking.test.js ./test/donorRankingService.test.js ./test/donor-eligibility.test.js

  ml-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r ml/requirements.txt
      - run: python ml/scripts/train_neural_ranker.py
      - run: python ml/scripts/evaluate_neural_ranker.py
      - run: pytest -q ml/tests/test_neural_ranker.py ml/tests/test_neural_ranker_api.py ml/tests/test_api.py
