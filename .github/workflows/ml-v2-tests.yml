name: ML ranking V2 tests

on:
  push:
    branches: [automation]
    paths:
      - "ml/**"
      - "backend/src/services/donorRankingService.js"
      - "backend/src/routes/donorEligibilityRoutes.js"
      - "backend/test/donorRankingService.test.js"
      - "backend/.env.example"
      - ".github/workflows/ml-v2-tests.yml"
  pull_request:
    paths:
      - "ml/**"
      - "backend/src/services/donorRankingService.js"
      - "backend/src/routes/donorEligibilityRoutes.js"
      - "backend/test/donorRankingService.test.js"

jobs:
  ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r ml/requirements.txt
      - run: pytest -q ml/tests/test_neural_ranker.py ml/tests/test_neural_ranker_api.py ml/tests/test_api.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix backend
      - run: npm --prefix backend test
